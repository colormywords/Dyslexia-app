<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dyslexia Syllable Analyzer</title>
    <style>
        body {
            font-family: 'Verdana', sans-serif;
            background-color: #fcfaf2;
            color: #333333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #1a1a1a;
            font-size: 24px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 18px;
            letter-spacing: 0.5px;
            resize: none;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #0076ff;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            margin-top: 15px;
            cursor: pointer;
        }
        .output-box {
            margin-top: 25px;
            padding: 20px;
            background: #fdfdfd;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            font-size: 22px;
            line-height: 1.8;
            letter-spacing: 1px;
            min-height: 100px;
        }
        .s1 { color: #0066cc; font-weight: bold; }
        .s2 { color: #e67e22; font-weight: bold; }
        .s3 { color: #9b59b6; font-weight: bold; }
        .s4 { color: #16a085; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dyslexia Syllable Analyzer</h1>
        <textarea id="inputText" placeholder="Type or paste sentences here..."></textarea>
        <button onclick="analyzeText()">Analyze Text</button>
        <div id="outputText" class="output-box"></div>
    </div>

    <script>
        const dictionary = {
            "into": ["in", "to"],
            "application": ["ap", "pli", "ca", "tion"],
            "dyslexia": ["dys", "lex", "i", "a"],
            "remediation": ["re", "me", "di", "a", "tion"],
            "uncomfortable": ["un", "com", "fort", "a", "ble"],
            "understanding": ["un", "der", "stand", "ing"]
        };

        function analyzeText() {
            const text = document.getElementById('inputText').value;
            const words = text.split(/(\s+)/);
            const outputArea = document.getElementById('outputText');
            outputArea.innerHTML = '';

            words.forEach(word => {
                const cleanWord = word.toLowerCase().replace(/[^a-z]/g, '');
                if (dictionary[cleanWord]) {
                    const syllables = dictionary[cleanWord];
                    let coloredWord = '';
                    syllables.forEach((syllable, index) => {
                        const colorClass = 's' + ((index % 4) + 1);
                        coloredWord += `<span class="${colorClass}">${syllable}</span>`;
                    });
                    outputArea.innerHTML += coloredWord;
                } else {
                    outputArea.innerHTML += word;
                }
            });
        }
    </script>
</body>
</html>
